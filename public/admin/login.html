<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>itexamportal | Admin Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
.card{width:min(420px,92%);background:white;padding:32px;border-radius:16px;box-shadow:0 12px 40px #17203318}
h1{margin-top:0;color:#2457c5}
p{color:#64748b;line-height:1.5}
label{display:block;margin:18px 0 7px;font-weight:600}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;margin-top:22px;padding:13px;background:#2457c5;color:white;border:0;border-radius:8px;font-size:16px;cursor:pointer}
#message{white-space:pre-wrap;margin-top:16px;color:#b42318}
small{display:block;margin-top:24px;color:#64748b}
</style>
</head>
<body>
<div class="card">
<h1>itexamportal</h1>
<h2>Administrator login</h2>
<p>Authorized administrators only.</p>
<form id="loginForm">
<label for="email">Admin email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<label for="code">Authenticator code</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
<button type="submit">Sign in</button>
</form>
<div id="message" role="status"></div>
<small>© 2026 itexamportal</small>
</div>
<script src="/admin/login.js" defer></script>
</body>
</html>
